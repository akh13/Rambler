name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libxcb-cursor0
      - run: pip install . pytest
      - run: python -m pytest -q tests
      - run: QT_QPA_PLATFORM=offscreen QT_AUDIO_BACKEND=alsa python tests/gui_smoke.py /tmp
